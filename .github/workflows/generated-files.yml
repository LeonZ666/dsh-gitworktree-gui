name: generated-files

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Final-tree gate: catches tracked artifacts, including force-added ones.
      - run: node scripts/check-generated.mjs

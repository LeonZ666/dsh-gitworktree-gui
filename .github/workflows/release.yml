name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-gitworktree-gui@${version}" version >/dev/null 2>&1; then
            echo "dsh-gitworktree-gui@${version} is already on npm; skipping publish"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Rebuild the market index with this release
        run: node scripts/build-market-index.mjs --from-npm
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
      - name: Commit the market index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/market
          if ! git diff --cached --quiet; then
            git commit -m "chore: market index for ${GITHUB_REF_NAME}"
            git push
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.tgz --title "${GITHUB_REF_NAME}" --generate-notes

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Git 工作树面板</title>
  <desc id="hero-desc">深色画布上是项目标题与说明：主干一条直线，分支从右侧分叉生长，合并后收回主干。右侧是同一规则的分支拓扑示意。</desc>

  <rect width="1200" height="400" fill="#0d1117"/>

  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif">
    <text y="86" fill="#8b949e" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.5">GIT WORKTREE PANEL · DSH RIGHT SIDEBAR</text>
    <text y="162" fill="#e6edf3" font-size="56" font-weight="700">Git 工作树面板</text>
    <text y="216" fill="#c9d1d9" font-size="24">主干一条直线，分支向右生长；</text>
    <text y="250" fill="#c9d1d9" font-size="24">合并收回主干，改动与文件在同一侧栏。</text>
    <text y="330" fill="#8b949e" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">只读 · NODE 20+ · MIT · v0.7.0</text>
  </g>

  <g id="topology" fill="none" stroke-linecap="round">
    <!-- trunk rail: one straight line, bottom to top -->
    <line x1="760" y1="344" x2="760" y2="76" stroke="#c9d1d9" stroke-width="3"/>

    <!-- feat/ui: forks right, grows up, still open -->
    <path d="M760 292 C 820 292 900 286 900 258 L900 150" stroke="#3fb950" stroke-width="3"/>
    <!-- feat/api: forks right, grows up, merges back into the trunk top -->
    <path d="M760 188 C 900 188 1040 178 1040 150 L1040 96" stroke="#d98a2b" stroke-width="3"/>
    <path d="M1040 96 C 1040 80 900 76 760 76" stroke="#d98a2b" stroke-width="3"/>

    <!-- commits on the trunk -->
    <g fill="#c9d1d9" stroke="none">
      <circle cx="760" cy="344" r="7"/>
      <circle cx="760" cy="292" r="7"/>
      <circle cx="760" cy="240" r="7"/>
      <circle cx="760" cy="188" r="7"/>
      <circle cx="760" cy="136" r="7"/>
    </g>
    <!-- merge commit: ring on the trunk -->
    <circle cx="760" cy="76" r="9" fill="#0d1117" stroke="#e6edf3" stroke-width="3"/>

    <!-- commits on feat/ui -->
    <g fill="#3fb950" stroke="none">
      <circle cx="900" cy="230" r="6"/>
    </g>
    <circle cx="900" cy="150" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>

    <!-- commits on feat/api -->
    <g fill="#d98a2b" stroke="none">
      <circle cx="1040" cy="140" r="6"/>
      <circle cx="1040" cy="110" r="6"/>
    </g>
    <circle cx="1040" cy="96" r="7" fill="#d98a2b" stroke="none"/>
  </g>

  <g id="labels" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <g>
      <rect x="722" y="38" width="76" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="760" y="57" text-anchor="middle" fill="#e6edf3">main</text>
    </g>
    <g>
      <rect x="916" y="136" width="100" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="930" y="155" fill="#3fb950">feat/ui</text>
    </g>
    <g>
      <rect x="1056" y="82" width="94" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="1070" y="101" fill="#d98a2b">feat/api</text>
    </g>
  </g>
</svg>

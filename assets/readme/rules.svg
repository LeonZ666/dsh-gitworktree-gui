<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="rules-title rules-desc">
  <title id="rules-title">图谱的三条规则</title>
  <desc id="rules-desc">三条规则各自配一张小图：主干是一条直线；每个分支从主干右侧分出一条独立轨道；合并后分支线收回主干，主干补到合并的高度。</desc>

  <rect width="1200" height="460" fill="#0d1117"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif">
    <!-- rule 1 -->
    <g transform="translate(0 30)">
      <text x="64" y="28" fill="#8b949e" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
      <text x="104" y="28" fill="#e6edf3" font-size="26" font-weight="600">主干是一条直线</text>
      <text x="64" y="64" fill="#8b949e" font-size="18">first-parent 链固定在 lane 0；没有新提交就停住。</text>

      <g stroke-linecap="round" fill="none">
        <line x1="860" y1="105" x2="860" y2="25" stroke="#c9d1d9" stroke-width="3"/>
        <g fill="#c9d1d9" stroke="none">
          <circle cx="860" cy="105" r="6"/>
          <circle cx="860" cy="80" r="6"/>
          <circle cx="860" cy="55" r="6"/>
          <circle cx="860" cy="30" r="6"/>
        </g>
      </g>
      <text x="880" y="70" fill="#8b949e" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lane 0</text>
    </g>

    <line x1="64" y1="160" x2="1136" y2="160" stroke="#21262d"/>

    <!-- rule 2 -->
    <g transform="translate(0 170)">
      <text x="64" y="28" fill="#8b949e" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
      <text x="104" y="28" fill="#e6edf3" font-size="26" font-weight="600">一个分支，一条右侧轨道</text>
      <text x="64" y="64" fill="#8b949e" font-size="18">从分叉点斜出，沿自己的 lane 向上生长。</text>

      <g stroke-linecap="round" fill="none">
        <line x1="860" y1="105" x2="860" y2="25" stroke="#c9d1d9" stroke-width="3"/>
        <g fill="#c9d1d9" stroke="none">
          <circle cx="860" cy="105" r="6"/>
          <circle cx="860" cy="80" r="6"/>
          <circle cx="860" cy="55" r="6"/>
        </g>
        <path d="M860 105 C 920 105 980 98 980 78 L980 30" stroke="#d98a2b" stroke-width="3"/>
        <g fill="#d98a2b" stroke="none">
          <circle cx="980" cy="78" r="5"/>
          <circle cx="980" cy="55" r="5"/>
        </g>
        <circle cx="980" cy="30" r="7" fill="#0d1117" stroke="#d98a2b" stroke-width="3"/>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
        <rect x="998" y="17" width="92" height="26" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="1012" y="35" fill="#d98a2b">feat/*</text>
      </g>
    </g>

    <line x1="64" y1="300" x2="1136" y2="300" stroke="#21262d"/>

    <!-- rule 3 -->
    <g transform="translate(0 310)">
      <text x="64" y="28" fill="#8b949e" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
      <text x="104" y="28" fill="#e6edf3" font-size="26" font-weight="600">合并，把线收回主干</text>
      <text x="64" y="64" fill="#8b949e" font-size="18">merge 回接分支，主干补到合并高度。</text>

      <g stroke-linecap="round" fill="none">
        <line x1="860" y1="105" x2="860" y2="25" stroke="#c9d1d9" stroke-width="3"/>
        <g fill="#c9d1d9" stroke="none">
          <circle cx="860" cy="105" r="6"/>
          <circle cx="860" cy="80" r="6"/>
          <circle cx="860" cy="55" r="6"/>
        </g>
        <path d="M860 105 C 920 105 980 98 980 78 L980 60 C 980 42 930 28 868 25" stroke="#d98a2b" stroke-width="3"/>
        <g fill="#d98a2b" stroke="none">
          <circle cx="980" cy="78" r="5"/>
        </g>
        <circle cx="860" cy="25" r="8" fill="#0d1117" stroke="#e6edf3" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>
